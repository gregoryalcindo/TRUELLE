plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gregory.truelle'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gregory.truelle'
        minSdk 29
        targetSdk 36
        versionCode 5
        versionName '0.6.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Aligne les versions de la bibliothèque Kotlin tirées par AndroidX (évite les classes en double).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Lot 2 : scanner de documents de Google (via les services Google Play) et lecture du texte sur le téléphone.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Lot 3 : autorisation Google pour Drive (même bibliothèque et même méthode que VYDEL).
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    testImplementation 'junit:junit:4.13.2'
}
