name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests de la logique
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee test.log || {
            msg=$( (grep -A 25 "What went wrong" test.log; grep -E "FAILED|error:" test.log; echo "--- fin du journal ---"; tail -40 test.log) | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Tests::$msg"
            exit 1
          }

      - name: Compiler l'APK debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log || {
            msg=$( (grep -A 25 "What went wrong" build.log; grep -E "error:|ERROR:" build.log; echo "--- fin du journal ---"; tail -40 build.log) | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Compilation::$msg"
            exit 1
          }

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v4
        with:
          name: truelle-debug
          path: app/build/outputs/apk/debug/*.apk
